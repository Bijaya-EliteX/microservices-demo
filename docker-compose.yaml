services:
  redis-cart:
    image: redis:alpine
    container_name: redis-cart
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  productcatalogservice:
    build: ./src/productcatalogservice
    container_name: productcatalogservice
    environment:
      - PORT=3550
      - DISABLE_PROFILER=1
    ports:
      - "3550:3550"
    restart: on-failure

  currencyservice:
    build: ./src/currencyservice
    container_name: currencyservice
    environment:
      - PORT=7000
      - DISABLE_PROFILER=1
    ports:
      - "7000:7000"
    restart: on-failure

  cartservice:
    build:
      context: ./src/cartservice/src
      dockerfile: Dockerfile
    container_name: cartservice
    environment:
      - REDIS_ADDR=redis-cart:6379
    ports:
      - "7070:7070"
    depends_on:
      redis-cart:
        condition: service_healthy
    restart: on-failure

  adservice:
    build: ./src/adservice
    container_name: adservice
    environment:
      - PORT=9555
    ports:
      - "9555:9555"
    restart: on-failure

  shippingservice:
    build: ./src/shippingservice
    container_name: shippingservice
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1
    ports:
      - "50051:50051"
    restart: on-failure

  emailservice:
    build: ./src/emailservice
    container_name: emailservice
    environment:
      - PORT=5000
      - DISABLE_PROFILER=1
    ports:
      - "5000:5000"
    restart: on-failure

  paymentservice:
    build: ./src/paymentservice
    container_name: paymentservice
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1
    ports:
      - "50052:50051"
    restart: on-failure

  checkoutservice:
    build: ./src/checkoutservice
    container_name: checkoutservice
    environment:
      - PORT=5050
      - DISABLE_PROFILER=1
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - PAYMENT_SERVICE_ADDR=paymentservice:50051
      - EMAIL_SERVICE_ADDR=emailservice:5000
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
    ports:
      - "5050:5050"
    depends_on:
      - productcatalogservice
      - shippingservice
      - paymentservice
      - emailservice
      - currencyservice
      - cartservice
    restart: on-failure

  recommendationservice:
    build: ./src/recommendationservice
    container_name: recommendationservice
    environment:
      - PORT=8080
      - DISABLE_PROFILER=1
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
    ports:
      - "8081:8080"
    depends_on:
      - productcatalogservice
    restart: on-failure

  frontend:
    build: ./src/frontend
    container_name: frontend
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - RECOMMENDATION_SERVICE_ADDR=recommendationservice:8080
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - CHECKOUT_SERVICE_ADDR=checkoutservice:5050
      - AD_SERVICE_ADDR=adservice:9555
      - SHOPPING_ASSISTANT_SERVICE_ADDR=shoppingassistantservice:80
    ports:
      - "8080:8080"
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - recommendationservice
      - shippingservice
      - checkoutservice
      - adservice
    restart: on-failure

  loadgenerator:
    build: ./src/loadgenerator
    container_name: loadgenerator
    environment:
      - FRONTEND_ADDR=frontend:8080
      - USERS=10
    depends_on:
      - frontend
    restart: on-failure
    profiles:
      - load
